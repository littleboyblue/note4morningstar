<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg)"/>

  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700" font-family="system-ui, sans-serif">JavaScript 与 WebAssembly 执行管线对比</text>

  <!-- JS lane -->
  <g filter="url(#shadow)">
    <rect x="30" y="56" width="740" height="126" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="50" y="84" fill="#f59e0b" font-size="13" font-weight="700" font-family="system-ui, sans-serif">JavaScript 执行管线</text>
  <text x="750" y="84" text-anchor="end" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">文本 → 解析 → JIT 预热 → 执行</text>

  <g filter="url(#shadow)">
    <rect x="50" y="98" width="140" height="66" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  </g>
  <text x="120" y="126" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui, sans-serif">JS 源码</text>
  <text x="120" y="146" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">纯文本</text>

  <g filter="url(#shadow)">
    <rect x="225" y="98" width="140" height="66" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  </g>
  <text x="295" y="126" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui, sans-serif">解析 Parse</text>
  <text x="295" y="146" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">生成 AST 与字节码</text>

  <g filter="url(#shadow)">
    <rect x="400" y="98" width="140" height="66" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  </g>
  <text x="470" y="126" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui, sans-serif">JIT 编译</text>
  <text x="470" y="146" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">逐层预热优化</text>

  <g filter="url(#shadow)">
    <rect x="575" y="98" width="165" height="66" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  </g>
  <text x="657" y="126" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui, sans-serif">执行 + 去优化</text>
  <text x="657" y="146" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">推测失误就回退重来</text>

  <line x1="194" y1="131" x2="218" y2="131" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="369" y1="131" x2="393" y2="131" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="544" y1="131" x2="568" y2="131" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <text x="400" y="214" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">同一个浏览器引擎 · 同一套沙箱 · 相互调用要走胶水边界</text>

  <!-- Wasm lane -->
  <g filter="url(#shadow)">
    <rect x="30" y="230" width="740" height="126" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="50" y="258" fill="#10b981" font-size="13" font-weight="700" font-family="system-ui, sans-serif">WebAssembly 执行管线</text>
  <text x="750" y="258" text-anchor="end" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">紧凑二进制 → 解码 → 编译 → 执行</text>

  <g filter="url(#shadow)">
    <rect x="50" y="272" width="140" height="66" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  </g>
  <text x="120" y="300" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, sans-serif">.wasm 模块</text>
  <text x="120" y="320" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">紧凑二进制</text>

  <g filter="url(#shadow)">
    <rect x="225" y="272" width="140" height="66" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  </g>
  <text x="295" y="300" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, sans-serif">解码 Decode</text>
  <text x="295" y="320" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">远快于 JS 解析</text>

  <g filter="url(#shadow)">
    <rect x="400" y="272" width="140" height="66" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  </g>
  <text x="470" y="300" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, sans-serif">编译 Compile</text>
  <text x="470" y="320" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">提前编译 无需预热</text>

  <g filter="url(#shadow)">
    <rect x="575" y="272" width="165" height="66" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  </g>
  <text x="657" y="300" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, sans-serif">执行</text>
  <text x="657" y="320" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">稳定接近原生性能</text>

  <line x1="194" y1="305" x2="218" y2="305" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="369" y1="305" x2="393" y2="305" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="544" y1="305" x2="568" y2="305" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <text x="400" y="385" text-anchor="middle" fill="#475569" font-size="10" font-family="system-ui, sans-serif">实际引擎中解码与编译高度流水线化，并支持边下载边编译（streaming compilation）</text>
</svg>
