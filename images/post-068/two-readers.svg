<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="800" height="380" rx="12" fill="url(#bg)"/>
  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" font-family="system-ui, sans-serif">同一个仓库，两类读者：AI 时代的开源项目多了「给 Agent 看」的一层</text>

  <rect x="24" y="62" width="212" height="236" rx="10" fill="#162236" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" font-family="system-ui, sans-serif">给人看</text>
  <text x="44" y="126" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">README · 截图教程</text>
  <text x="44" y="154" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">Releases · 桌面客户端</text>
  <text x="44" y="182" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">手动清单 · 五档用法</text>
  <text x="44" y="210" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">机型表 · 实测记录</text>
  <text x="44" y="238" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">备份与还原说明</text>
  <text x="44" y="266" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">边界与免责声明</text>

  <rect x="280" y="62" width="240" height="236" rx="10" fill="#162236" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="92" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" font-family="system-ui, sans-serif">同一个仓库</text>
  <text x="300" y="126" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">代码：Go / Rust / Python</text>
  <text x="300" y="154" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">AGENTS.md · 产品契约</text>
  <text x="300" y="182" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">SKILL.md · 用法说明</text>
  <text x="300" y="210" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">给 Agent 的 CLI</text>
  <text x="300" y="238" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">recipes · 机型脚本</text>
  <text x="300" y="266" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">回读 · 快照 · 验证</text>

  <rect x="564" y="62" width="212" height="236" rx="10" fill="#162236" stroke="#34d399" stroke-width="1.5"/>
  <text x="670" y="92" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" font-family="system-ui, sans-serif">给 Agent 看</text>
  <text x="584" y="126" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">读硬规则再动手</text>
  <text x="584" y="154" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">按引用操作元素</text>
  <text x="584" y="182" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">每步回读确认</text>
  <text x="584" y="210" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">出错停下来问人</text>
  <text x="584" y="238" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">产物要能还原</text>
  <text x="584" y="266" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">取版本匹配的 skills</text>

  <line x1="276" y1="182" x2="240" y2="182" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="258" y="172" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">人读</text>
  <line x1="524" y1="182" x2="560" y2="182" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="542" y="172" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">Agent 读</text>

  <rect x="24" y="314" width="752" height="44" rx="8" fill="#0b1220" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="400" y="341" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="system-ui, sans-serif">AI 同时站在两端：生产端帮人写代码，消费端按契约读文档、动手、再验证</text>
</svg>
