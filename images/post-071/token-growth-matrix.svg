<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg71c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="12" fill="url(#bg71c)"/>
  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">Token 增长不等于利润增长</text>
  <text x="400" y="56" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">横轴是规模，纵轴是质量；先看纵轴，再看横轴</text>

  <!-- Quadrant backgrounds -->
  <rect x="110" y="80" width="300" height="125" fill="#38bdf8" opacity="0.06"/>
  <rect x="410" y="80" width="300" height="125" fill="#34d399" opacity="0.08"/>
  <rect x="110" y="205" width="300" height="125" fill="#f472b6" opacity="0.06"/>
  <rect x="410" y="205" width="300" height="125" fill="#fbbf24" opacity="0.07"/>

  <!-- Axes -->
  <line x1="110" y1="205" x2="710" y2="205" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="410" y1="80" x2="410" y2="330" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="110" y1="330" x2="710" y2="330" stroke="#334155" stroke-width="1"/>
  <line x1="110" y1="80" x2="110" y2="330" stroke="#334155" stroke-width="1"/>

  <text x="700" y="352" text-anchor="end" fill="#64748b" font-size="9.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">Token 总量 →</text>
  <text x="96" y="205" transform="rotate(-90 96 205)" text-anchor="middle" fill="#64748b" font-size="9.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">单件成功交付毛利 →</text>

  <!-- Top left -->
  <text x="130" y="112" fill="#38bdf8" font-size="13.5" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">精益区</text>
  <text x="130" y="134" fill="#cbd5e1" font-size="9.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">量不大，但每件都赚钱</text>
  <text x="130" y="154" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">先验证单位经济，再找扩张路径</text>

  <!-- Top right -->
  <text x="430" y="112" fill="#34d399" font-size="13.5" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">健康规模化</text>
  <text x="430" y="134" fill="#cbd5e1" font-size="9.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">Token 涨，单件毛利也涨</text>
  <text x="430" y="154" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">多烧的 token 换回了更多毛利，可以踩油门</text>

  <!-- Bottom left -->
  <text x="130" y="238" fill="#f472b6" font-size="13.5" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">收缩区</text>
  <text x="130" y="260" fill="#cbd5e1" font-size="9.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">量价齐跌，先止损</text>
  <text x="130" y="280" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">别再谈规模化，先回答“为谁做”</text>

  <!-- Bottom right -->
  <text x="430" y="238" fill="#fbbf24" font-size="13.5" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">用利润买增长</text>
  <text x="430" y="260" fill="#cbd5e1" font-size="9.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">交付变多，但每件越做越薄</text>
  <text x="430" y="280" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">要有明确的规模效应或战略理由</text>

  <line x1="110" y1="366" x2="710" y2="366" stroke="#334155" stroke-width="1"/>
  <text x="110" y="388" fill="#cbd5e1" font-size="10.5" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">最危险的不是 token 涨，而是 token 涨、单件成本涨、单件毛利跌，团队还在说“我们在规模化”。</text>
  <text x="110" y="408" fill="#64748b" font-size="9" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">注：单件毛利 = 单件收入 − 单件推理成本 − 单件兜底成本；三个指标同时恶化时，应优先修单位经济。</text>
</svg>
