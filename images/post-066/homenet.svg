<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg)"/>

  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700" font-family="system-ui, sans-serif">家庭网络拓扑：一切服务都在 VPN 与局域网之内</text>

  <!-- Public internet -->
  <g filter="url(#shadow)">
    <rect x="30" y="90" width="140" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="100" y="118" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">公网 Internet</text>
  <text x="100" y="138" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">IPv4 在 CGNAT 后</text>
  <text x="100" y="156" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">公网不可直连</text>

  <!-- Mobile device -->
  <g filter="url(#shadow)">
    <rect x="30" y="230" width="140" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="100" y="258" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">外出设备（手机）</text>
  <text x="100" y="278" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">关 Wi-Fi 走移动数据</text>
  <text x="100" y="296" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">VPN 回家访问服务</text>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="250" y="100" width="150" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="325" y="135" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" font-family="system-ui, sans-serif">家庭路由器</text>
  <text x="325" y="160" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">路由器上的 VPN 服务</text>
  <text x="325" y="178" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">公网唯一入口</text>
  <text x="325" y="196" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">仅 IPv6 可路由</text>

  <!-- LAN container -->
  <g filter="url(#shadow)">
    <rect x="470" y="60" width="300" height="280" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="490" y="88" fill="#10b981" font-size="13" font-weight="700" font-family="system-ui, sans-serif">家庭局域网（LAN）</text>

  <g filter="url(#shadow)">
    <rect x="495" y="100" width="250" height="56" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  </g>
  <text x="620" y="122" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Caddy 反向代理</text>
  <text x="620" y="140" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Let's Encrypt 自动 HTTPS · 子域名</text>

  <g filter="url(#shadow)">
    <rect x="495" y="176" width="250" height="56" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  </g>
  <text x="620" y="198" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, sans-serif">N100 迷你主机 · 28 个服务</text>
  <text x="620" y="216" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">16GB RAM · 全部由 systemd 管理</text>

  <g filter="url(#shadow)">
    <rect x="495" y="252" width="118" height="56" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="554" y="274" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600" font-family="system-ui, sans-serif">6TB HDD</text>
  <text x="554" y="292" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">媒体与备份存储</text>

  <g filter="url(#shadow)">
    <rect x="627" y="252" width="118" height="56" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="686" y="274" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600" font-family="system-ui, sans-serif">IP 摄像头 ×8</text>
  <text x="686" y="292" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">Frigate NVR 识别</text>

  <text x="620" y="330" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">另有树莓派与 Proxmox 集群，Beszel 统一监控</text>

  <!-- Arrows -->
  <line x1="174" y1="160" x2="243" y2="160" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="208" y="150" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">仅 IPv6</text>

  <line x1="174" y1="272" x2="242" y2="232" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="205" y="262" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">IPv6 VPN</text>

  <line x1="404" y1="152" x2="487" y2="130" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <line x1="620" y1="160" x2="620" y2="172" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <line x1="554" y1="232" x2="554" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <line x1="686" y1="252" x2="686" y2="238" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <text x="400" y="380" text-anchor="middle" fill="#475569" font-size="10" font-family="system-ui, sans-serif">唯一对外的口子是路由器上的 VPN；其余一切服务只活在局域网里，HTTPS 由 Caddy 统一提供</text>
</svg>
