<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowBlue3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg3)"/>
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" font-family="system-ui, sans-serif">从一台机器到一层服务：路由、分离、三级 KV</text>

  <rect x="32" y="92" width="140" height="80" rx="8" fill="#162236" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="102" y="118" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Model Gateway</text>
  <text x="102" y="138" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="system-ui, sans-serif">cache-aware 路由</text>
  <text x="102" y="156" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">按前缀命中挑 worker</text>

  <rect x="212" y="56" width="190" height="72" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="307" y="80" text-anchor="middle" fill="#dbeafe" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Prefill 池</text>
  <text x="307" y="100" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="system-ui, sans-serif">算力密集 · 决定 TTFT</text>
  <text x="307" y="118" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="system-ui, sans-serif">长 prompt 一次吃完</text>

  <rect x="212" y="162" width="190" height="72" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
  <text x="307" y="186" text-anchor="middle" fill="#dcfce7" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Decode 池</text>
  <text x="307" y="206" text-anchor="middle" fill="#dcfce7" font-size="10" font-family="system-ui, sans-serif">带宽密集 · 决定 TPOT</text>
  <text x="307" y="224" text-anchor="middle" fill="#bbf7d0" font-size="10" font-family="system-ui, sans-serif">每一步只出一个 token</text>

  <path d="M172 116 L208 92" stroke="#38bdf8" stroke-width="1.4" fill="none" marker-end="url(#arrowBlue3)"/>
  <path d="M172 148 L208 188" stroke="#38bdf8" stroke-width="1.4" fill="none" marker-end="url(#arrowBlue3)"/>
  <path d="M307 128 L307 158" stroke="#f59e0b" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAmber3)"/>
  <text x="316" y="148" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif">KV</text>

  <text x="430" y="74" fill="#f59e0b" font-size="12" font-weight="700" font-family="system-ui, sans-serif">为什么值得拆</text>
  <text x="430" y="98" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">· 预填充是矩阵乘，解码是访存，算术强度差一个量级</text>
  <text x="430" y="124" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">· 混在一个 batch 里，GPU 两头都吃不满</text>
  <text x="430" y="150" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">· 拆开后可以按各自特点选卡、各自扩缩容</text>
  <text x="430" y="176" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">· 代价：KV 要跨机搬一次，网络成了新瓶颈</text>
  <text x="430" y="202" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">· 所以小集群别急，先在单机把命中率做上去</text>
  <text x="430" y="228" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">· 传输后端：RDMA · NIXL · Mooncake · DeepEP</text>

  <text x="32" y="262" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">KV 住在哪：HiCache 的三级</text>

  <rect x="32" y="276" width="232" height="86" rx="8" fill="#162236" stroke="#3b82f6" stroke-width="1"/>
  <text x="48" y="298" fill="#7dd3fc" font-size="12" font-weight="700" font-family="system-ui, sans-serif">L1 · GPU 显存</text>
  <text x="48" y="318" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">容量：几十 GB</text>
  <text x="48" y="336" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">带宽：TB/s 级</text>
  <text x="48" y="354" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">命中一次就省一次 prefill</text>

  <rect x="284" y="276" width="232" height="86" rx="8" fill="#162236" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="298" fill="#86efac" font-size="12" font-weight="700" font-family="system-ui, sans-serif">L2 · 主机内存</text>
  <text x="300" y="318" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">容量：TB 级（ratio 默认 2 倍）</text>
  <text x="300" y="336" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">带宽：几十 GB/s</text>
  <text x="300" y="354" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">跨请求、跨轮次复用</text>

  <rect x="536" y="276" width="232" height="86" rx="8" fill="#162236" stroke="#f59e0b" stroke-width="1"/>
  <text x="552" y="298" fill="#fcd34d" font-size="12" font-weight="700" font-family="system-ui, sans-serif">L3 · 共享存储</text>
  <text x="552" y="318" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">容量：PB 级</text>
  <text x="552" y="336" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">file · Mooncake · HF3FS · NIXL</text>
  <text x="552" y="354" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">多副本共享，跨节点命中</text>

  <text x="32" y="386" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">只有 L3 有可能跨副本共享——前提是所有实例指向同一个命名空间；L1、L2 始终是单个实例私有的。</text>
</svg>
