<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg2)"/>
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" font-family="system-ui, sans-serif">RadixAttention：把请求前缀挂到一棵树上</text>

  <text x="32" y="66" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">三条请求，共享前 10K token</text>

  <rect x="32" y="78" width="176" height="34" rx="6" fill="#1d4ed8"/>
  <text x="120" y="100" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">系统提示 8K</text>
  <rect x="210" y="78" width="58" height="34" rx="6" fill="#15803d"/>
  <text x="239" y="100" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">2K</text>
  <rect x="270" y="78" width="82" height="34" rx="6" fill="#7c3aed"/>
  <text x="311" y="100" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">问题 A</text>

  <rect x="32" y="124" width="176" height="34" rx="6" fill="#1d4ed8"/>
  <text x="120" y="146" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">系统提示 8K</text>
  <rect x="210" y="124" width="58" height="34" rx="6" fill="#15803d"/>
  <text x="239" y="146" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">2K</text>
  <rect x="270" y="124" width="82" height="34" rx="6" fill="#b45309"/>
  <text x="311" y="146" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">问题 B</text>

  <rect x="32" y="170" width="176" height="34" rx="6" fill="#1d4ed8"/>
  <text x="120" y="192" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">系统提示 8K</text>
  <rect x="210" y="170" width="58" height="34" rx="6" fill="#15803d"/>
  <text x="239" y="192" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">2K</text>
  <rect x="270" y="170" width="82" height="34" rx="6" fill="#be123c"/>
  <text x="311" y="192" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">问题 C</text>

  <rect x="32" y="222" width="320" height="44" rx="8" fill="#162236" stroke="#475569" stroke-width="1"/>
  <text x="46" y="240" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">蓝、绿两段只算一次，KV 留在树上</text>
  <text x="46" y="258" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">紫、橙、红三段才是各自新增的 prefill</text>

  <rect x="552" y="62" width="76" height="28" rx="6" fill="#162236" stroke="#64748b" stroke-width="1"/>
  <text x="590" y="81" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">root</text>

  <rect x="494" y="108" width="192" height="30" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="590" y="128" text-anchor="middle" fill="#dbeafe" font-size="11" font-family="system-ui, sans-serif">…系统提示 8K · refs=3</text>

  <rect x="494" y="154" width="192" height="30" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
  <text x="590" y="174" text-anchor="middle" fill="#dcfce7" font-size="11" font-family="system-ui, sans-serif">…任务说明 2K · refs=3</text>

  <rect x="410" y="206" width="100" height="30" rx="6" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="460" y="226" text-anchor="middle" fill="#ede9fe" font-size="11" font-family="system-ui, sans-serif">问题 A</text>
  <rect x="540" y="206" width="100" height="30" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="590" y="226" text-anchor="middle" fill="#fef3c7" font-size="11" font-family="system-ui, sans-serif">问题 B</text>
  <rect x="670" y="206" width="100" height="30" rx="6" fill="#7f1d1d" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="720" y="226" text-anchor="middle" fill="#ffe4e6" font-size="11" font-family="system-ui, sans-serif">问题 C</text>

  <path d="M590 90 L590 106" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <path d="M590 138 L590 152" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <path d="M590 184 L590 194 L460 194 L460 204" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M590 184 L590 194 L590 204" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M590 184 L590 194 L720 194 L720 204" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#arrowGray)"/>

  <rect x="410" y="256" width="360" height="76" rx="8" fill="#162236" stroke="#475569" stroke-width="1"/>
  <text x="424" y="276" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">命中：沿树找回 KV，只跑新 token 的 prefill</text>
  <text x="424" y="296" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">未命中：从最近的公共祖先往下重算</text>
  <text x="424" y="316" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">满了按最近访问淘汰叶子，被引用的节点更晚收走</text>

  <text x="32" y="356" fill="#7dd3fc" font-size="11" font-family="system-ui, sans-serif">首 token 延迟 ≈ 新算 token 数 × prefill 单位耗时：前缀越稳定、轮次越多，收益越大。</text>
  <text x="32" y="378" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">树不按请求切分，只要前缀逐 token 一致就复用——所以 Agent 负载比闲聊更吃这套机制。</text>
</svg>
