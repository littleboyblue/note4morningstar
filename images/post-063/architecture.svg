<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg)"/>

  <text x="400" y="34" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700" font-family="system-ui, sans-serif">Cloudflare Workers + D1 整体架构</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="30" y="120" width="130" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="95" y="150" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" font-family="system-ui, sans-serif">客户端</text>
  <text x="95" y="172" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">浏览器 / App</text>
  <text x="95" y="192" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">HTTPS 请求</text>

  <!-- Edge network -->
  <g filter="url(#shadow)">
    <rect x="220" y="60" width="300" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="370" y="88" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Cloudflare 全球边缘网络（300+ 节点）</text>

  <!-- Worker -->
  <g filter="url(#shadow)">
    <rect x="245" y="106" width="250" height="80" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  </g>
  <text x="370" y="132" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Worker（V8 Isolate）</text>
  <text x="370" y="152" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">路由 / 鉴权 / 参数校验</text>
  <text x="370" y="172" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">env.DB.prepare(...).bind(...)</text>

  <!-- Bindings -->
  <g filter="url(#shadow)">
    <rect x="245" y="206" width="76" height="64" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="283" y="232" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600" font-family="system-ui, sans-serif">KV</text>
  <text x="283" y="252" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">缓存/配置</text>

  <g filter="url(#shadow)">
    <rect x="333" y="206" width="76" height="64" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="371" y="232" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600" font-family="system-ui, sans-serif">R2</text>
  <text x="371" y="252" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">对象存储</text>

  <g filter="url(#shadow)">
    <rect x="421" y="206" width="76" height="64" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  </g>
  <text x="459" y="232" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Queues</text>
  <text x="459" y="252" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui, sans-serif">异步任务</text>

  <!-- D1 -->
  <g filter="url(#shadow)">
    <rect x="590" y="70" width="180" height="100" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="680" y="100" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700" font-family="system-ui, sans-serif">D1 主库</text>
  <text x="680" y="122" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">分布式 SQLite</text>
  <text x="680" y="142" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">所有写入走主库</text>

  <g filter="url(#shadow)">
    <rect x="590" y="200" width="180" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="680" y="228" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui, sans-serif">只读副本（自动同步）</text>
  <text x="680" y="250" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">就近读取 · 最终一致</text>

  <!-- Migration note -->
  <g filter="url(#shadow)">
    <rect x="220" y="310" width="550" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <text x="245" y="335" fill="#38bdf8" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Schema 管理</text>
  <text x="245" y="355" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">migrations/*.sql 顺序执行 · wrangler d1 migrations apply 本地与线上同一套流程</text>

  <!-- Arrows -->
  <line x1="160" y1="165" x2="238" y2="165" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="495" y1="140" x2="584" y2="115" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="584" y1="145" x2="495" y2="160" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="680" y1="170" x2="680" y2="192" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowG)"/>
  <line x1="370" y1="186" x2="370" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowB)"/>
</svg>
