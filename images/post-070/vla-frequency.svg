<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hot2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="100%" stop-color="#123c5c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg)"/>
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" font-family="system-ui, sans-serif">VLA 的三层频率：慢思考、快执行、硬约束</text>

  <rect x="24" y="56" width="752" height="70" rx="8" fill="#162236" stroke="#818cf8" stroke-width="1.5"/>
  <text x="44" y="84" fill="#818cf8" font-size="13" font-weight="700" font-family="system-ui, sans-serif">慢思考</text>
  <text x="44" y="106" fill="#a5b4fc" font-size="11" font-family="system-ui, sans-serif">1–5 Hz</text>
  <text x="210" y="84" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">VLM / 规划器：看懂场景、把「把桌子收拾一下」拆成子任务</text>
  <text x="210" y="106" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">可以调用工具、可以反复想；这里慢一点没关系，想错才致命。</text>

  <rect x="24" y="140" width="752" height="70" rx="8" fill="url(#hot2)" stroke="#22d3ee" stroke-width="2"/>
  <text x="44" y="168" fill="#22d3ee" font-size="13" font-weight="700" font-family="system-ui, sans-serif">快执行</text>
  <text x="44" y="190" fill="#7dd3fc" font-size="11" font-family="system-ui, sans-serif">10–50 Hz</text>
  <text x="210" y="168" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">动作专家（flow matching / diffusion）：一次输出未来 H 步动作 chunk</text>
  <text x="210" y="190" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">chunk 越长越稳、越难纠错；chunk 越短越灵活、越容易抖。</text>

  <rect x="24" y="224" width="752" height="70" rx="8" fill="#162236" stroke="#f472b6" stroke-width="1.5"/>
  <text x="44" y="252" fill="#f472b6" font-size="13" font-weight="700" font-family="system-ui, sans-serif">硬约束</text>
  <text x="44" y="274" fill="#f9a8d4" font-size="11" font-family="system-ui, sans-serif">200–1000 Hz</text>
  <text x="210" y="252" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif">传统控制与安全层：力矩限幅、碰撞检测、工作空间、急停</text>
  <text x="210" y="274" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">不学习、不联网、不解释，只保证一件事：不出事。</text>

  <path d="M100 126 L100 138" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M96 133 L100 139 L104 133" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M100 210 L100 222" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M96 217 L100 223 L104 217" fill="none" stroke="#475569" stroke-width="1.5"/>

  <text x="24" y="322" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">越往下：频率越高、模型越小、越不可学习、越要可验证。</text>
  <text x="24" y="344" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">上层可以错——重新规划一次；下层不能错——撞上去就是撞上去了。</text>
  <text x="24" y="366" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">所以安全层必须独立于学习模型，这也是「端到端」在机器人上迟迟不敢全押的原因。</text>
</svg>
